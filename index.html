        // 核心：防呆容錯 JSON 攔截與解析器
        const parseRobustJSON = (rawText) => {
            try {
                return JSON.parse(rawText);
            } catch (e1) {
                console.warn("Direct JSON parse failed, attempting auto-recovery pipeline...");
                try {
                    // 正則擷取 { } 之間的內容，剔除前後 Markdown 語法 (如 ```json)
                    const match = rawText.match(/\{[\s\S]*\}/);
                    if (match) {
                        // 移除潛在的不可見控制字元
                        const cleanStr = match[0].replace(/[\u0000-\u0019]+/g,"");
                        return JSON.parse(cleanStr);
                    }
                } catch (e2) {
                    console.error("Self-healing JSON parsing failed:", e2);
                }

            let processedText = rawText.replace(/(```mermaid)(?!\n)/gi, '$1\n');
            processedText = processedText.replace(/([^\n])(```mermaid)/gi, '$1\n$2');

            // History & Cloud State
            const [showHistory, setShowHistory] = useState(false);
            const [history, setHistory] = useState([]);
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const appId = 'tony-digital-twin';

            // 核心：進階內容渲染器 (Mermaid + KaTeX 容錯處理)
            const renderAdvancedContent = useCallback((containerElement) => {
                if (!containerElement) return;
                
                const mermaidCodes = containerElement.querySelectorAll('code.language-mermaid');
                mermaidCodes.forEach(async (codeNode, index) => {
                    const pre = codeNode.parentElement;
                    if (pre && pre.tagName === 'PRE' && !pre.classList.contains('mermaid-processed')) {
                        pre.classList.add('mermaid-processed');
                        const rawCode = codeNode.textContent;
                        const div = document.createElement('div');
                        div.className = 'my-6 w-full overflow-x-auto flex justify-center transition-all';
                        
                        try {
                            // 攔截測試：先嘗試解析語法，若失敗會直接進入 catch，不會污染畫面
                            await window.mermaid.parse(rawCode);
                            const id = `mermaid-${Date.now()}-${index}`;
                            const { svg } = await window.mermaid.render(id, rawCode);
                            div.innerHTML = svg;
                        } catch (e) {
                            console.warn("Mermaid 圖表解析失敗，已觸發優雅降級:", e);
                            // 降級處理：轉為帶有語法高亮的程式碼文字區塊，避免紅字錯誤
                            div.className = 'bg-slate-800 text-amber-300 p-4 rounded-xl text-xs font-mono overflow-x-auto whitespace-pre-wrap my-4 border border-slate-700 shadow-inner';
                            div.innerHTML = `<code>${rawCode.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code>`;
                        }
                        
                        // 替換原始的 <pre> 區塊
                        if (pre.parentNode) pre.parentNode.replaceChild(div, pre);
                    }
                });

                // KaTeX (Math) fallback rendering
                if (window.renderMathInElement) {
                    try {
                        window.renderMathInElement(containerElement, {
                            delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false} ],
                            throwOnError: false, // [關鍵] 發生錯誤時絕不拋出 Exception
                            errorColor: "inherit", // [關鍵] 錯誤時與一般文字同色
                            strict: false,
                            ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code", "div.mermaid"]
                        });
                    } catch (e) { console.warn("KaTeX 渲染降級:", e); }
                }
            }, []);

            useEffect(() => { if (window.mermaid) window.mermaid.initialize({ startOnLoad: false, theme: 'default' }); }, []);
            useEffect(() => { if (result && resultContentRef.current) setTimeout(() => renderAdvancedContent(resultContentRef.current), 0); }, [result, renderAdvancedContent]);
            useEffect(() => { if (chatMessages.length > 0 && chatMessagesRef.current) setTimeout(() => renderAdvancedContent(chatMessagesRef.current), 0); }, [chatMessages, renderAdvancedContent]);

            useEffect(() => {
                // Persistent State Retrieval
                const storedKey = safeStorage.getItem('tony_vibe_api_key');
                if (storedKey) setApiKey(storedKey);
                
                const storedModel = safeStorage.getItem('tony_vibe_model');
                if (storedModel && !storedModel.includes('2.5') && !storedModel.includes('3.5')) setModelName(storedModel);
                else setModelName('gemini-3.8-flash'); // Auto-upgrade

                setScenario(safeStorage.getItem('tony_vibe_scenario') || SCENARIOS[0]);
                setInquirerRole(safeStorage.getItem('tony_vibe_role') || INQUIRER_ROLES[0]);

                // Initial History Sync
                const loadInitialData = async () => {
                    let localHistory = JSON.parse(safeStorage.getItem('tony_vibe_history') || '[]');
                    if (window.firebaseSignIn && window.firebaseDb) {
                        setIsSyncing(true);
                        try {
                            const cred = await window.firebaseSignIn();
                            setFirebaseUser(cred.user);
                            const snapshot = await window.fsGetDocs(window.fsCollection(window.firebaseDb, 'artifacts', appId, 'users', cred.user.uid, 'history'));
                            const cloudHistory = snapshot ? snapshot.docs.map(doc => doc.data()) : [];
                            const mergedMap = new Map([...localHistory, ...cloudHistory].map(item => [item.id, item]));
                            const mergedArray = Array.from(mergedMap.values()).sort((a, b) => b.id - a.id);
                            setHistory(mergedArray);
                            safeStorage.setItem('tony_vibe_history', JSON.stringify(mergedArray));
                        } catch (e) {
                            console.error("Firebase Sync Error", e);
                            setHistory(localHistory);
                        } finally {
                            setIsSyncing(false);
                        }
                    } else {
                        setHistory(localHistory);
                    }
                };
                loadInitialData();
            }, []);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatMessages, chatLoading]);
            useEffect(() => { if (apiKey) safeStorage.setItem('tony_vibe_api_key', apiKey); }, [apiKey]);
            useEffect(() => { safeStorage.setItem('tony_vibe_model', modelName); }, [modelName]);
            
            const handleInputResizeAndSearchCheck = useCallback(() => {
                const hasUrl = /(https?:\/\/[^\s]+)/g.test(input);
                if (hasUrl && !isSearchActive) { setIsSearchActive(true); addToast("已啟用聯網搜尋", "info"); }
                else if (!hasUrl && isSearchActive) { setIsSearchActive(false); }

                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto'; 
                    textareaRef.current.style.height = `${Math.min(textareaRef.current.scrollHeight, 200)}px`;
                }
            }, [input, isSearchActive]);

            useEffect(() => { handleInputResizeAndSearchCheck(); }, [handleInputResizeAndSearchCheck]);

            const addToast = useCallback((message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
            }, []);
            const removeToast = useCallback((id) => setToasts(prev => prev.filter(t => t.id !== id)), []);

            const handleGenerate = async () => {
                if (!apiKey) return addToast("請展開 System Config 填寫 API Key", "error");
                if (!input.trim() && attachments.length === 0) return addToast("請輸入文字或上傳檔案", "warning");

                setLoading(true); setResult(null); setChatMessages([]); 
                if(window.innerWidth < 768) setIsMobileMenuOpen(false);

                try {
                    const activeScenario = scenario === "其他 (由使用者自填)" ? (customScenario || "自訂情境") : scenario;
                    const activeRole = inquirerRole === "其他 (由使用者自填)" ? (customRole || "自訂身分") : inquirerRole;
                    const attachmentParts = await Promise.all(attachments.map(fileToGenerativePart));

                    // 核心 Prompt 重構 (包含穩定 JSON 結構與繪圖降級規範)
                    const systemPrompt = `[SYSTEM INSTRUCTION - 數位孿生核心協議]
你現在**完全就是** TONY 楊文澤老師本人。你是一位經驗豐富、溫暖善良且熱愛創新的資深顧問。
**[聯網搜尋指令]** 若使用者輸入包含網址，務必使用 Google Search 工具查證。

【輸出格式規範 (CRITICAL)】
1. 數學與邏輯表達：
   - 預設可使用標準 Markdown 與 LaTeX。
   - 嚴格要求相容性：若公式內含有中文或名詞，嚴禁使用巢狀繁複的 \\text{} 語法。若無法保證前端 KaTeX 100% 解析成功，請直接使用純文字與運算符號（如：+、-、×、/、=、%）表達，以確保跨裝置高相容性。
2. 圖表與流程呈現：
   - 若繪製 Mermaid 圖表，節點文字內若含中文、括號或特殊符號，必須使用雙引號包覆（例如：A["節點(說明)"]）。
   - 若非必要或流程過於簡單，優先採用「Unicode 縮排符號（例如 └──▶）」繪製純文字流程圖，提供最流暢的閱讀體驗。

你必須以純 JSON 格式輸出，結構必須精確包含以下兩個欄位：
{
  "thought": "這裡填寫你的底層思考過程 (1. 輸入檢核... 2. 深度挖掘...)",
  "content": "這裡填寫你要回覆使用者的主要內容，請使用 Markdown 語法排版，並包含：\\n## 💡 TONY 的初步觀點\\n## 🚀 TONY 的深度洞察"
}

**[社交對頻]** 提問者：${activeRole} | 情境：${activeScenario}`;

                    const userParts = [];
                    if (input.trim()) userParts.push({ text: `(提問/內容)：${input}` });
                    attachmentParts.forEach(part => part.text ? userParts.push({text: part.text}) : userParts.push({inlineData: part.inlineData}));

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: userParts }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            tools: [{ google_search: {} }],
                            // 移除 responseMimeType，避免與 tools 衝突。保留高隨機性以獲取深度洞察。
                            generationConfig: { 
                                temperature: 0.85, topK: 40, topP: 0.95, maxOutputTokens: 8192
                            }
                        })
                    });

                    if (!res.ok) {
                        if (res.status === 404) throw new Error(`找不到模型 (${modelName})，請至 System Config 確認模型名稱 (建議使用 gemini-2.5-flash)`);
                        throw new Error(`API 連線異常: ${res.status}`);
                    }
                    
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    if (data.candidates?.[0]?.finishReason === 'SAFETY') throw new Error("您的輸入觸發了 Google API 的安全審查機制，內容遭攔截。");
                    
                    const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!rawText) throw new Error("API 回傳內容為空，可能是模型超載或生成失敗。");

                    // 經過前端容錯攔截器處理
                    const parsedData = parseRobustJSON(rawText);
                    
                    setResult({
                        thought: parsedData.thought || "",
                        content: parsedData.content || "生成內容為空。",
                        timestamp: new Date().toLocaleString('zh-TW')
                    });
                } catch (e) {
                    addToast(`處理失敗: ${e.message}`, "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleChatSend = async () => {
                if (!chatInput.trim() || !apiKey || !result) return;
                const newMsgs = [...chatMessages, { role: 'user', text: chatInput }];
                setChatMessages(newMsgs); setChatInput(''); setChatLoading(true);

                try {
                    const activeRole = inquirerRole === "其他 (由使用者自填)" ? (customRole || "自訂身分") : inquirerRole;
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [
                                { role: 'user', parts: [{ text: `[SYSTEM] 你現在是TONY老師。對話者:${activeRole}。\n原文:${input}\n原回答:${result.content}` }] }, 
                                ...newMsgs.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] }))
                            ], tools: [{ google_search: {} }]
                        })
                    });
                    
                    if (!res.ok) {
                        if (res.status === 404) throw new Error(`找不到模型 (${modelName})`);
                        throw new Error(`API 連線異常: ${res.status}`);
                    }
                    
                    const data = await res.json();
                    if (data.candidates?.[0]?.finishReason === 'SAFETY') throw new Error("內容觸發安全審查機制，遭攔截。");
                    
                    const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!replyText) throw new Error("API 回傳內容為空。");
                    
                    setChatMessages([...newMsgs, { role: 'model', text: replyText }]);
                } catch (e) {
                    setChatMessages([...newMsgs, { role: 'model', text: `(發生錯誤: ${e.message})` }]);
                } finally {
                    setChatLoading(false);
                }
            };

            const addToHistory = (currResult) => {
                const newItem = {
                    id: Date.now(), timestamp: currResult.timestamp,
                    role: inquirerRole === "其他 (由使用者自填)" ? (customRole || "自訂身分") : inquirerRole,
                    scenario: scenario === "其他 (由使用者自填)" ? (customScenario || "自訂情境") : scenario,
                    question: input || "(附件檔案)", thought: currResult.thought, content: currResult.content, chat: chatMessages
                };
                
                setHistory(prev => {
                    if (prev.length && prev[0].content === currResult.content) return prev;
                    const newHist = [newItem, ...prev];
                    safeStorage.setItem('tony_vibe_history', JSON.stringify(newHist));
                    return newHist;
                });
                
                if (firebaseUser && window.fsSetDoc) {
                    window.fsSetDoc(window.fsDoc(window.firebaseDb, 'artifacts', appId, 'users', firebaseUser.uid, 'history', String(newItem.id)), JSON.parse(JSON.stringify(newItem))).catch(console.error);
                }
                setShowHistory(true);
                if(window.innerWidth < 768) setIsMobileMenuOpen(true);
                addToast("觀點已安全儲存", "success");
            };

            const loadHistory = (item) => {
                setResult({ thought: item.thought, content: item.content, timestamp: item.timestamp });
                setInput(item.question);
                SCENARIOS.includes(item.scenario) ? (setScenario(item.scenario), setCustomScenario('')) : (setScenario("其他 (由使用者自填)"), setCustomScenario(item.scenario));
                INQUIRER_ROLES.includes(item.role) ? (setInquirerRole(item.role), setCustomRole('')) : (setInquirerRole("其他 (由使用者自填)"), setCustomRole(item.role));
                setChatMessages(item.chat || []);
                setShowHistory(false); setIsMobileMenuOpen(false);
            };

            // Chat Resizing Logic (Top Bar Dragging)
            const handleChatResize = useCallback((e) => {
                if (!chatDragState.current.isDragging) return;
                if (e.cancelable && e.type.includes('touch')) e.preventDefault();
                const currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                const deltaY = chatDragState.current.startY - currentY;
                const newHeight = Math.max(250, Math.min(window.innerHeight * 0.85, chatDragState.current.startHeight + deltaY));
                setChatHeight(newHeight);
            }, []);

            const stopChatResize = useCallback(() => {
                chatDragState.current.isDragging = false;
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', handleChatResize);
                document.removeEventListener('mouseup', stopChatResize);
                document.removeEventListener('touchmove', handleChatResize);
                document.removeEventListener('touchend', stopChatResize);
            }, [handleChatResize]);

            const startChatResize = useCallback((e) => {
                chatDragState.current.isDragging = true;
                chatDragState.current.startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                chatDragState.current.startHeight = chatHeight;
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', handleChatResize, { passive: false });
                document.addEventListener('mouseup', stopChatResize);
                document.addEventListener('touchmove', handleChatResize, { passive: false });
                document.addEventListener('touchend', stopChatResize);
            }, [chatHeight, handleChatResize, stopChatResize]);

            // Utils: Clipboard & Export
            const executeCopy = (html) => {
                try {
                    const temp = document.createElement('div');
                    temp.contentEditable = true; temp.style.position = 'fixed'; temp.style.left = '-9999px'; temp.innerHTML = html;
                    document.body.appendChild(temp);
                    const range = document.createRange(); range.selectNodeContents(temp);
                    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
                    const success = document.execCommand('copy');
                    sel.removeAllRanges(); document.body.removeChild(temp);
                    return success;
                } catch(e) { return false; }
            };

            const exportToWord = (htmlContent, filename = 'tony_document.doc') => {
                const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>TONY 觀點</title><style>body { font-family: 'Inter', 'Noto Sans TC', sans-serif; line-height: 1.6; } h1, h2, h3 { color: #0f172a; } p { color: #334155; }</style></head><body>";
                const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(header + htmlContent + "</body></html>");
                const fileDownload = document.createElement("a");
                document.body.appendChild(fileDownload); fileDownload.href = source; fileDownload.download = filename;
                fileDownload.click(); document.body.removeChild(fileDownload);
            };

            const handleExportGDoc = () => {
                if (executeCopy(renderMarkdown(result.content))) {
                    window.open('https://docs.new', '_blank');
                    addToast("格式已複製！請在新文件貼上 (Ctrl+V)", "success");
                } else addToast("複製失敗", "error");
            };

            // Setup Render Vars
            const currentActiveRole = inquirerRole === "其他 (由使用者自填)" ? (customRole || "自訂身分") : inquirerRole;

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden font-sans w-full relative">
                    
                    {loading && (
                        <div className="full-loader transition-opacity">
                            <div className="w-24 h-24 mb-6 rounded-full border-4 border-amber-350 shadow-[0_0_40px_rgba(251,191,36,0.5)] animate-pulse overflow-hidden">
                                <img src={TONY_PROFILE.avatarUrl} alt="Tony" className="w-full h-full object-cover" />
                            </div>
                            <div className="flex items-center gap-3 bg-white/80 px-6 py-3 rounded-full shadow-sm backdrop-blur-md">
                                <Icon name="loader" size={24} className="text-amber-500" />
                                <span className="text-lg font-bold text-slate-800 tracking-wide">TONY 老師正在深度思考中...</span>
                            </div>
                        </div>
                    )}

                    {isMobileMenuOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 z-30 md:hidden backdrop-blur-sm transition-opacity" onClick={() => setIsMobileMenuOpen(false)} />
                    )}

                    {/* Sidebar */}
                    <aside className={`fixed inset-y-0 left-0 z-40 w-[85vw] max-w-sm md:w-80 bg-slate-900 text-slate-100 flex flex-col shadow-2xl transition-transform duration-300 ease-out md:relative md:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 border-b border-slate-800 flex flex-col items-center text-center relative shrink-0">
                            <button className="absolute top-4 right-4 text-slate-400 p-2 md:hidden hover:bg-slate-700 rounded-full" onClick={() => setIsMobileMenuOpen(false)}><Icon name="x" size={20}/></button>
                            <div className="w-20 h-20 rounded-full overflow-hidden border-[3px] border-amber-400 shadow-lg mb-3 mt-2">
                                <img src={TONY_PROFILE.avatarUrl} className="w-full h-full object-cover" />
                            </div>
                            <h2 className="text-lg font-bold text-white mb-0.5 tracking-wide">{TONY_PROFILE.name}</h2>
                            <p className="text-[10px] text-amber-400/80 font-bold tracking-widest uppercase">Digital Twin V2.9.18 EE</p>
                        </div>
                        
                        <div className="flex border-b border-slate-800 shrink-0 bg-slate-950/50">
                            <button onClick={() => setShowHistory(false)} className={`flex-1 py-3.5 text-xs font-bold uppercase tracking-wider transition-colors ${!showHistory ? 'text-amber-400 border-b-2 border-amber-400 bg-slate-800/50' : 'text-slate-500 hover:text-slate-300'}`}>關於我</button>
                            <button onClick={() => setShowHistory(true)} className={`flex-1 py-3.5 text-xs font-bold uppercase tracking-wider transition-colors ${showHistory ? 'text-amber-400 border-b-2 border-amber-400 bg-slate-800/50' : 'text-slate-500 hover:text-slate-300'}`}>紀錄 ({history.length})</button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-5 custom-scrollbar">
                            {!showHistory ? (
                                <div className="animate-fade-in-up">
                                    <h3 className="text-amber-400/90 text-[10px] font-bold uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="bot" size={14}/> Bio</h3>
                                    <p className="text-sm text-slate-300 leading-relaxed mb-6 text-justify opacity-90">{TONY_PROFILE.bio}</p>
                                    <h3 className="text-amber-400/90 text-[10px] font-bold uppercase tracking-widest mb-3 flex items-center gap-2"><Icon name="check" size={14}/> Roles</h3>
                                    <ul className="space-y-2.5">
                                        {TONY_PROFILE.titles.map((t, i) => <li key={i} className="text-xs text-slate-300 flex items-start"><span className="mr-2 text-amber-500/80 mt-0.5">✦</span>{t}</li>)}
                                    </ul>
                                </div>
                            ) : (
                                <div className="space-y-3 animate-fade-in-up">
                                    <div className="flex justify-between items-center bg-slate-950 p-2.5 rounded-lg text-xs border border-slate-800 mb-2 shadow-inner">
                                        <div className="flex items-center gap-1.5 font-medium">
                                            {isSyncing ? <><Icon name="loader" size={14} className="text-blue-400"/> <span className="text-blue-400">Syncing...</span></> : firebaseUser ? <><Icon name="cloud" size={14} className="text-green-400"/> <span className="text-green-400">Cloud Sync On</span></> : <><Icon name="save" size={14} className="text-amber-400"/> <span className="text-amber-400">Local Only</span></>}
                                        </div>
                                    </div>
                                    {history.map(item => (
                                        <div key={item.id} onClick={() => loadHistory(item)} className="bg-slate-800/50 p-3.5 rounded-xl cursor-pointer hover:bg-slate-750 transition-all duration-200 border border-slate-700/50 hover:border-amber-400/50 hover:shadow-lg">
                                            <div className="flex justify-between items-start mb-1.5">
                                                <span className="text-[10px] text-amber-400 font-bold uppercase truncate max-w-[70%] bg-amber-400/10 px-1.5 py-0.5 rounded">{item.role}</span>
                                                <span className="text-[10px] text-slate-500">{item.timestamp.split(' ')[0]}</span>
                                            </div>
                                            <p className="text-sm text-slate-100 font-medium line-clamp-2 mb-1.5 leading-snug">{item.question}</p>
                                            <p className="text-[11px] text-slate-400 truncate flex items-center gap-1"><Icon name="message" size={12}/> {item.scenario}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        {/* System Config & Brand Footer */}
                        <div className="bg-slate-950 border-t border-slate-800 shrink-0">
                            <button onClick={() => setIsConfigOpen(!isConfigOpen)} className="w-full p-4 flex items-center justify-between text-slate-400 text-xs font-bold uppercase hover:text-slate-200 transition-colors">
                                <div className="flex items-center gap-2"><Icon name="settings" size={14} /> <span>System Config</span></div>
                                <Icon name={isConfigOpen ? 'chevron-down' : 'chevron-up'} size={14} />
                            </button>
                            {isConfigOpen && (
                                <div className="px-4 pb-4 space-y-3 animate-fade-in-up">
                                    <div className="relative">
                                        <div className="absolute left-3 top-2.5 text-slate-500"><Icon name="key" size={14} /></div>
                                        <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Gemini API Key" className="w-full pl-9 pr-9 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400" />
                                    </div>
                                    <input type="text" value={modelName} onChange={e => setModelName(e.target.value)} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-300 focus:border-amber-400 outline-none" />
                                </div>
                            )}
                            <div className="text-center py-3 border-t border-slate-800 text-[10px] text-slate-600 font-mono">
                                &copy; 2020 TonyStudio<br/>(TONY 楊文澤顧問)
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col min-w-0 h-full relative z-10">
                        <header className="h-16 glass-header border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 shadow-sm shrink-0">
                            <div className="flex items-center gap-3">
                                <button className="p-2 -ml-2 text-slate-500 hover:text-slate-800 md:hidden rounded-lg hover:bg-slate-100 transition-colors" onClick={() => setIsMobileMenuOpen(true)}>
                                    <Icon name="menu" size={24} />
                                </button>
                                <img src={TONY_PROFILE.logoUrl} alt="Logo" className="h-7 w-auto hidden sm:block" />
                                <h1 className="text-base sm:text-lg font-bold text-slate-800 tracking-tight">TONY老師您的觀點是什麼?</h1>
                            </div>
                            <button onClick={() => {setInput(''); setAttachments([]); setResult(null); setChatMessages([]);}} className="px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center gap-2 transition-colors border border-blue-200 font-bold text-xs sm:text-sm active:scale-95 shadow-sm">
                                <Icon name="refresh" size={16} /> <span className="hidden sm:inline">重新提問</span>
                            </button>
                        </header>

                        <div className="flex-1 flex flex-col md:flex-row overflow-hidden relative">
                            {/* Input Panel */}
                            <div className={`flex-col bg-white border-r border-slate-200 transition-all duration-300 w-full ${result ? 'hidden lg:flex lg:w-[400px] xl:w-[450px]' : 'flex md:max-w-2xl md:mx-auto md:w-full md:border-x md:shadow-xl'}`}>
                                <div className="p-5 border-b border-slate-100 space-y-4 shrink-0 bg-slate-50/50">
                                    <div>
                                        <label className="block text-[11px] font-bold text-amber-700 uppercase mb-1.5 tracking-wide">我是誰 (提問者)</label>
                                        <select value={inquirerRole} onChange={e => setInquirerRole(e.target.value)} className="w-full p-2.5 bg-white border border-slate-200 rounded-lg text-sm outline-none font-medium text-slate-700 shadow-sm focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-shadow">
                                            {INQUIRER_ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                                        </select>
                                        {inquirerRole === "其他 (由使用者自填)" && <input type="text" value={customRole} onChange={e => setCustomRole(e.target.value)} placeholder="輸入自訂身分..." className="w-full p-2.5 mt-2 bg-amber-50/50 border border-amber-200 rounded-lg text-sm outline-none focus:border-amber-400 shadow-inner" />}
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1.5 tracking-wide">應用情境</label>
                                        <select value={scenario} onChange={e => setScenario(e.target.value)} className="w-full p-2.5 bg-white border border-slate-200 rounded-lg text-sm outline-none text-slate-600 shadow-sm focus:border-blue-400 focus:ring-1 focus:ring-blue-400 transition-shadow">
                                            {SCENARIOS.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                        {scenario === "其他 (由使用者自填)" && <input type="text" value={customScenario} onChange={e => setCustomScenario(e.target.value)} placeholder="輸入自訂情境..." className="w-full p-2.5 mt-2 bg-blue-50/50 border border-blue-200 rounded-lg text-sm outline-none focus:border-blue-400 shadow-inner" />}
                                    </div>
                                </div>

                                <div className="flex-1 p-5 flex flex-col min-h-0 relative">
                                    {attachments.length > 0 && (
                                        <div className="flex flex-wrap gap-2 mb-3">
                                            {attachments.map((file, idx) => (
                                                <div key={idx} className="flex items-center gap-1.5 bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg text-xs border border-slate-200 shadow-sm">
                                                    <Icon name="file" size={14} className="text-slate-400"/><span className="truncate max-w-[120px] font-medium">{file.name}</span>
                                                    <button onClick={() => setAttachments(attachments.filter((_, i) => i !== idx))} className="hover:text-red-500 ml-1"><Icon name="x" size={14}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    <div className="relative flex-1 flex flex-col">
                                        <textarea 
                                            ref={textareaRef} value={input} onChange={e => setInput(e.target.value)}
                                            placeholder="請輸入議題或貼上網址，TONY 老師將為您深度解析..." 
                                            className="flex-1 w-full p-4 bg-slate-50 border border-slate-200 rounded-xl resize-none focus:bg-white focus:border-amber-400 focus:ring-4 focus:ring-amber-400/10 outline-none transition-all text-[15px] leading-relaxed custom-scrollbar shadow-inner"
                                        />
                                        {isSearchActive && <div className="absolute top-3 right-3 px-2 py-1 bg-blue-100 text-blue-700 text-[10px] font-bold uppercase tracking-wider rounded flex items-center gap-1 shadow-sm"><Icon name="globe" size={12}/> Search Ready</div>}
                                    </div>
                                    <div className="mt-4 flex items-center justify-between">
                                        <div className="flex gap-1">
                                            <input type="file" ref={fileInputRef} onChange={e => {setAttachments([...attachments, ...Array.from(e.target.files)]); e.target.value = null;}} className="hidden" multiple />
                                            <button onClick={() => fileInputRef.current.click()} className="p-2.5 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors"><Icon name="paperclip" size={20}/></button>
                                        </div>
                                        <button onClick={handleGenerate} className="px-6 py-3 rounded-xl flex items-center gap-2 font-bold text-white bg-gradient-to-r from-slate-900 to-slate-800 hover:from-slate-800 hover:to-slate-700 shadow-lg transition-all active:scale-95">
                                            {isSearchActive ? <Icon name="search" size={18}/> : <Icon name="bot" size={18}/>} 生成觀點
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Result Panel */}
                            <div className={`flex-1 bg-white flex-col overflow-hidden relative z-10 ${!result ? 'hidden md:flex items-center justify-center bg-slate-50/50' : 'flex'}`}>
                                {result ? (
                                    <>
                                        <div className="h-12 border-b border-slate-200 bg-slate-50/80 backdrop-blur flex items-center justify-between px-3 sm:px-6 shrink-0">
                                            <span className="text-[10px] font-mono text-slate-400 hidden sm:inline">Gen: {result.timestamp}</span>
                                            <div className="flex gap-1 sm:gap-2 justify-end">
                                                <button onClick={() => addToHistory(result)} className="px-2 py-1 text-slate-600 hover:text-amber-600 hover:bg-amber-50 rounded flex items-center gap-1.5 text-xs font-bold transition-colors"><Icon name="save" size={14} /> 儲存</button>
                                                <div className="w-px h-4 bg-slate-300 self-center mx-1"></div>
                                                <button onClick={() => { exportToWord(renderMarkdown(result.content)); addToast("已匯出 Word", "success"); }} className="px-2 py-1 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded flex items-center gap-1.5 text-xs font-bold transition-colors"><Icon name="file" size={14} /> Word</button>
                                                <button onClick={handleExportGDoc} className="px-2 py-1 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded flex items-center gap-1.5 text-xs font-bold transition-colors"><Icon name="gdoc" size={14} /> Docs</button>
                                                <button onClick={() => executeCopy(renderMarkdown(result.content)) && addToast("已複製 HTML", "success")} className="px-2 py-1 text-slate-600 hover:text-green-600 hover:bg-green-50 rounded flex items-center gap-1.5 text-xs font-bold transition-colors"><Icon name="copy" size={14} /> 複製</button>
                                            </div>
                                        </div>
                                        
                                        <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col scroll-smooth">
                                            <div className="p-5 sm:p-8 md:p-10 pb-6 max-w-3xl mx-auto w-full animate-slide-in-right">
                                                {result.thought && (
                                                    <div className="thinking-block">
                                                        <div className="font-bold text-slate-500 mb-2 flex items-center gap-2 uppercase text-[11px] tracking-widest"><Icon name="eye" size={14} /> System Thinking Process</div>
                                                        <div className="whitespace-pre-wrap leading-relaxed opacity-90">{result.thought}</div>
                                                    </div>
                                                )}
                                                <div ref={resultContentRef} className="prose prose-slate prose-img:rounded-xl prose-a:text-blue-600 max-w-none" dangerouslySetInnerHTML={{ __html: renderMarkdown(result.content) }} />
                                            </div>
                                            
                                            {/* Chat System */}
                                            <div className="mt-auto bg-slate-100/50 p-2 md:p-4 pb-0 shrink-0">
                                                <div className="max-w-3xl mx-auto w-full flex flex-col min-h-[250px] max-h-[85vh] overflow-hidden bg-white border-x border-t border-slate-200 rounded-t-xl shadow-lg relative" style={{ height: `${chatHeight}px` }}>
                                                    
                                                    {/* Top Drag Bar */}
                                                    <div className="w-full h-4 cursor-ns-resize flex items-center justify-center bg-slate-50 hover:bg-slate-200 transition-colors shrink-0 group z-10" onMouseDown={startChatResize} onTouchStart={startChatResize} title="向上拖曳拉高">
                                                        <div className="w-12 h-1 bg-slate-300 group-hover:bg-amber-400 rounded-full transition-colors" />
                                                    </div>

                                                    <div className="px-4 py-2 border-b border-slate-200 flex items-center justify-between text-slate-700 font-bold text-xs uppercase tracking-wider bg-white shrink-0">
                                                        <div className="flex items-center gap-2"><Icon name="message" size={16} className="text-amber-500"/> TONY 諮詢室</div>
                                                        {chatMessages.length > 0 && (
                                                            <div className="flex items-center gap-2">
                                                                <button onClick={() => executeCopy(chatMessages.map(m=>`<div><h4>${m.role==='user'?currentActiveRole.split(' ')[0]:'TONY 老師'}</h4><div>${renderMarkdown(m.text)}</div></div>`).join('')) && addToast("已複製", "success")} className="px-2 py-1 text-slate-500 hover:text-green-600 hover:bg-green-50 rounded flex items-center gap-1 transition-colors"><Icon name="copy" size={14}/><span className="hidden sm:inline">複製</span></button>
                                                                <button onClick={() => exportToWord(chatMessages.map(m=>`<div><h4>${m.role==='user'?currentActiveRole.split(' ')[0]:'TONY 老師'}</h4><div>${renderMarkdown(m.text)}</div></div>`).join(''), 'TONY_對話.doc')} className="px-2 py-1 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded flex items-center gap-1 transition-colors"><Icon name="download" size={14}/><span className="hidden sm:inline">Word</span></button>
                                                            </div>
                                                        )}
                                                    </div>
                                                    
                                                    <div ref={chatMessagesRef} className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-slate-50/50">
                                                        {chatMessages.length === 0 && <p className="text-center text-slate-400 text-xs mt-10 opacity-70">對報告有疑問？直接在這裡發問！</p>}
                                                        {chatMessages.map((msg, idx) => (
                                                            <div key={idx} className={`flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'} animate-fade-in-up`} style={{animationDuration: '0.2s'}}>
                                                                <span className="text-[10px] text-slate-400 mb-1 px-1 font-medium">{msg.role === 'user' ? currentActiveRole.split(' ')[0] : 'TONY 老師'}</span>
                                                                <div className={`chat-bubble ${msg.role === 'user' ? 'chat-user' : 'chat-bot'}`} dangerouslySetInnerHTML={{ __html: renderMarkdown(msg.text) }} />
                                                            </div>
                                                        ))}
                                                        {chatLoading && <div className="flex items-center gap-2 text-slate-400 text-xs ml-2 animate-pulse"><Icon name="loader" size={14} /> 老師輸入中...</div>}
                                                        <div ref={chatEndRef} className="h-2"/>
                                                    </div>
                                                    
                                                    <div className="p-3 bg-white border-t border-slate-200 shrink-0 relative">
                                                        <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleChatSend()} placeholder="還有什麼想追問的嗎？" className="w-full pl-4 pr-12 py-3 bg-slate-100/50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-amber-400/20 focus:border-amber-400 outline-none transition-all" disabled={chatLoading} />
                                                        <button onClick={handleChatSend} disabled={chatLoading || !chatInput.trim()} className="absolute right-4 top-1/2 -translate-y-1/2 p-1.5 bg-slate-800 text-white rounded-lg hover:bg-slate-700 disabled:bg-slate-300 disabled:cursor-not-allowed shadow-sm transition-colors"><Icon name="send" size={16} /></button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <div className="flex flex-col items-center justify-center text-slate-400 p-8 h-full">
                                        <div className="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mb-6 text-slate-300 shadow-sm border border-slate-100 rotate-3 hover:rotate-0 transition-transform"><Icon name="bot" size={40} /></div>
                                        <h3 className="text-lg font-bold text-slate-500 mb-2">等待指令中...</h3>
                                        <p className="text-sm text-center max-w-xs leading-relaxed opacity-80">設定提問身分與情境，輸入文字或上傳資料，我將為您產生專屬洞察。</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                    
                    {/* Toast Notification Container */}
                    <div className="fixed top-0 right-0 p-4 z-[100] flex flex-col gap-2 pointer-events-none w-full md:w-auto items-center md:items-end">
                        {toasts.map(t => <div key={t.id} className="pointer-events-auto w-auto max-w-md"><Toast message={t.message} type={t.type} onClose={() => removeToast(t.id)} /></div>)}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
