            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                    const arrayBuffer = reader.result;
                    
                    if (file.type === "application/vnd.openxmlformats-officedocument.wordprocessingml.document") {
                        mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                            .then(result => {
                                resolve({
                                    text: `[附件內容: ${file.name}]\n${result.value}`
                                });
                            })
                            .catch(err => reject(err));
                    } else {
                        const base64Reader = new FileReader();
                        base64Reader.onloadend = () => {
                            const base64Data = base64Reader.result.split(',')[1];
                            resolve({
                                inlineData: {
                                    data: base64Data,
                                    mimeType: file.type
                                }
                            });
                        };
                        base64Reader.readAsDataURL(file);
                    }
                };

                    </div>
                    <h1 className="text-white text-xl font-bold tracking-widest uppercase">TONY STUDIO</h1>
                    <div className="w-40 h-1 bg-gray-700 mt-4 rounded-full overflow-hidden">
                        <div className="h-full bg-amber-350 w-full animate-[shimmer_1.5s_infinite]"></div>
                    </div>
                    <p className="text-gray-500 text-xs mt-2 font-mono">Loading System Core...</p>
                </div>
            </div>
        );

        function App() {
            // State
            const [apiKey, setApiKey] = useState('');
            const [modelName, setModelName] = useState('gemini-2.5-pro'); 
            const [showHistory, setShowHistory] = useState(false); 
            const [toasts, setToasts] = useState([]);
            const [systemReady, setSystemReady] = useState(false);
            
            // Core Configs
            const [scenario, setScenario] = useState(SCENARIOS[0]);
            const [inquirerRole, setInquirerRole] = useState(INQUIRER_ROLES[0]); 
            
            const [input, setInput] = useState('');
            const [attachments, setAttachments] = useState([]); 
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null); 
            const [error, setError] = useState(null); 
            const [isSearchActive, setIsSearchActive] = useState(false); 
            
            // Chat State
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [chatLoading, setChatLoading] = useState(false);
            const chatEndRef = useRef(null);

            // History State
            const [history, setHistory] = useState([]);

            const [firebaseUser, setFirebaseUser] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'tony-digital-twin';

            const fileInputRef = useRef(null);
            const textareaRef = useRef(null);
            
            // Load settings & History
            useEffect(() => {
                const storedKey = safeStorage.getItem('tony_vibe_api_key');
                if (storedKey) setApiKey(storedKey);
                
                const storedModel = safeStorage.getItem('tony_vibe_model');
                if (storedModel && storedModel !== 'gemini-2.5-flash' && !storedModel.includes('exp')) { 
                     setModelName(storedModel);
                } else {
                     setModelName('gemini-2.5-pro');
                }

                const storedScenario = safeStorage.getItem('tony_vibe_scenario');
                if (storedScenario) setScenario(storedScenario);

                const storedRole = safeStorage.getItem('tony_vibe_role');
                if (storedRole) setInquirerRole(storedRole);

                // --- Load History (Local & Cloud Merge) ---
                const localHistoryRaw = safeStorage.getItem('tony_vibe_history');
                let localHistory = [];
                if (localHistoryRaw) {
                    try { localHistory = JSON.parse(localHistoryRaw); } catch(e){}
                }

                if (window.firebaseSignIn && window.firebaseDb) {
                    setIsSyncing(true);
                    window.firebaseSignIn().then(cred => {
                        setFirebaseUser(cred.user);
                        const colRef = window.fsCollection(window.firebaseDb, 'artifacts', appId, 'users', cred.user.uid, 'history');
                        return window.fsGetDocs(colRef);
                    })
                    .then(snapshot => {
                        const cloudHistory = [];
                        if (snapshot) {
                            snapshot.forEach(doc => { cloudHistory.push(doc.data()); });
                        }
                        
                        // Merge Cloud and Local
                        const mergedMap = new Map();
                        localHistory.forEach(item => mergedMap.set(item.id, item));
                        cloudHistory.forEach(item => mergedMap.set(item.id, item)); // Cloud overwrites local if identical ID
                        
                        const mergedArray = Array.from(mergedMap.values()).sort((a, b) => b.id - a.id);
                        setHistory(mergedArray);
                        
                        // Sync back to local storage
                        if (mergedArray.length > 0) {
                            safeStorage.setItem('tony_vibe_history', JSON.stringify(mergedArray));
                        }
                        setIsSyncing(false);
                    })
                    .catch(e => {
                        console.error("Firebase Sync Error:", e);
                        setHistory(localHistory); 
                        setIsSyncing(false);
                    });
                } else {
                    setHistory(localHistory);
                }

                setSystemReady(true);
                setTimeout(() => setSystemReady(false), 3000);
            }, []);

            // Auto-scroll chat
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [chatMessages]);

            // Save settings
            useEffect(() => { 
                if (apiKey) {
                    safeStorage.setItem('tony_vibe_api_key', apiKey); 
                }
            }, [apiKey]);
            
            useEffect(() => { safeStorage.setItem('tony_vibe_model', modelName); }, [modelName]);
            useEffect(() => { safeStorage.setItem('tony_vibe_scenario', scenario); }, [scenario]);
            useEffect(() => { safeStorage.setItem('tony_vibe_role', inquirerRole); }, [inquirerRole]);
            useEffect(() => { safeStorage.setItem('tony_vibe_history', JSON.stringify(history)); }, [history]);

            // Detect Links for Search Mode & Auto Resize
            useEffect(() => {
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                const hasUrl = urlRegex.test(input);
                if (hasUrl && !isSearchActive) {
                    setIsSearchActive(true);
                    addToast("🌐 已偵測到連結，將啟用聯網搜尋", "info");
                } else if (!hasUrl && isSearchActive) {
                    setIsSearchActive(false);
                }

                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto'; 
                    textareaRef.current.style.height = `${Math.min(textareaRef.current.scrollHeight, 200)}px`;
                }
            }, [input]);

            // Toast Helper
            const addToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
            };

            const removeToast = (id) => {
                setToasts(prev => prev.filter(t => t.id !== id));
            };

            // API Key Blur Handler
            const handleApiKeyBlur = () => {
                if (apiKey.length > 10) {
                    addToast("🔑 API Key 已安全儲存", "success");
                }
            };

            // File Handlers
            const handleFileSelect = (e) => {
                const files = Array.from(e.target.files);
                if (attachments.length + files.length > 10) {
                    addToast("最多只能上傳 10 個附件", "error");
                    return;
                }
                setAttachments([...attachments, ...files]);
                e.target.value = null; 
                addToast(`已加入 ${files.length} 個附件`, "info");
            };

            const removeAttachment = (index) => {
                const newAttachments = [...attachments];
                newAttachments.splice(index, 1);
                setAttachments(newAttachments);
            };

            // Reset Handler
            const handleReset = () => {
                // Clear state
                setInput('');
                setAttachments([]);
                setResult(null);
                setChatMessages([]);
                setError(null);
                setIsSearchActive(false);
                
                // Clear File Input (Important fix)
                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
                
                // Reset Textarea Height
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                }

                addToast("🧹 已清空話題，請重新提問", "success");
            };

            // History Handlers
            const addToHistory = (currResult) => {
                const newItem = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleString('zh-TW'),
                    role: inquirerRole,
                    scenario: scenario,
                    question: input || "(附件檔案分析)",
                    thought: currResult.thought,
                    content: currResult.content,
                    chat: chatMessages
                };
                
                const newHistory = [newItem, ...history];
                setHistory(newHistory);
                safeStorage.setItem('tony_vibe_history', JSON.stringify(newHistory));
                
                // Sync to Cloud
                if (firebaseUser && window.fsSetDoc) {
                    const docRef = window.fsDoc(window.firebaseDb, 'artifacts', appId, 'users', firebaseUser.uid, 'history', String(newItem.id));
                    window.fsSetDoc(docRef, JSON.parse(JSON.stringify(newItem))).catch(e => console.error("Cloud Save Error", e));
                }

                addToast("已儲存至歷史紀錄與雲端", "success");
            };

            const deleteHistory = (id, e) => {
                e.stopPropagation();
                const newHistory = history.filter(item => item.id !== id);
                setHistory(newHistory);
                safeStorage.setItem('tony_vibe_history', JSON.stringify(newHistory));
                
                // Delete from Cloud
                if (firebaseUser && window.fsDeleteDoc) {
                    const docRef = window.fsDoc(window.firebaseDb, 'artifacts', appId, 'users', firebaseUser.uid, 'history', String(id));
                    window.fsDeleteDoc(docRef).catch(e => console.error("Cloud Delete Error", e));
                }
                
                addToast("紀錄已刪除", "info");
            };

            const handleExportHistory = () => {
                if (history.length === 0) {
                    addToast("沒有可以匯出的紀錄", "warning");
                    return;
                }
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(history, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `tony_history_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                addToast("歷史紀錄 JSON 已備份匯出", "success");
            };

            const handleImportHistory = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (Array.isArray(importedData)) {
                            const mergedMap = new Map();
                            history.forEach(item => mergedMap.set(item.id, item));
                            
                            let addedCount = 0;
                            importedData.forEach(item => {
                                if (item.id && !mergedMap.has(item.id)) {
                                    mergedMap.set(item.id, item);
                                    addedCount++;
                                    
                                    // Sync imported item to Cloud
                                    if (firebaseUser && window.fsSetDoc) {
                                        const docRef = window.fsDoc(window.firebaseDb, 'artifacts', appId, 'users', firebaseUser.uid, 'history', String(item.id));
                                        window.fsSetDoc(docRef, JSON.parse(JSON.stringify(item))).catch(console.error);
                                    }
                                }
                            });
                            
                            const newHistory = Array.from(mergedMap.values()).sort((a,b) => b.id - a.id);
                            setHistory(newHistory);
                            safeStorage.setItem('tony_vibe_history', JSON.stringify(newHistory));
                            
                            if (addedCount > 0) {
                                addToast(`成功匯入並同步 ${addedCount} 筆新紀錄`, "success");
                            } else {
                                addToast("匯入的紀錄已存在，無新增項目", "info");
                            }
                        } else {
                            addToast("不支援的檔案格式 (需為陣列結構的 JSON)", "error");
                        }
                    } catch (err) {
                        console.error(err);
                        addToast("解析 JSON 失敗，請確認檔案格式", "error");
                    }
                    e.target.value = null; 
                };
                reader.readAsText(file);
            };

            const loadHistory = (item) => {
                setResult({
                    thought: item.thought,
                    content: item.content,
                    timestamp: item.timestamp
                });
                setInput(item.question);
                setScenario(item.scenario);
                setInquirerRole(item.role);
                setChatMessages(item.chat || []);
                setShowHistory(false);
                addToast("已載入歷史紀錄", "success");
            };

            // Main Generate Handler
            const handleGenerate = async () => {
                if (!apiKey) {
                    addToast("請先輸入您的 Google Gemini API Key", "error");
                    return;
                }
                if (!input.trim() && attachments.length === 0) {
                    addToast("請輸入文字或上傳檔案", "error");
                    return;
                }

                setLoading(true);
                setError(null);
                setResult(null);
                setChatMessages([]); 
                addToast("🚀 TONY 老師正在思考與撰寫中...", "info");

                try {
                    const attachmentParts = await Promise.all(
                        attachments.map(file => fileToGenerativePart(file))
                    );

                    const systemPrompt = `
[SYSTEM INSTRUCTION - 數位孿生 V2.9.17 核心協議]
你現在**完全就是** TONY 楊文澤老師本人。
你是一位 60 歲、經驗豐富、溫暖善良且熱愛創新的資深顧問。

**[聯網搜尋指令]**
當使用者的輸入包含網址 (URL) 時，請**務必**使用 Google Search 工具去獲取資訊。
- **嚴禁**在未經搜尋查證的情況下，憑空捏造網址內容。

**[輸出結構]**
請務必將回答內容明確分為以下兩個部分 (使用 Markdown 二級標題 ##)：

## 💡 TONY 的初步觀點
- 針對問題，給出廣度優先的回答。

## 🚀 TONY 的深度洞察
- 提出「底層邏輯」或「具體策略」。
- 使用 **粗體** 強調關鍵字。

**[社交對頻]**
提問者：${inquirerRole} | 情境：${scenario}

**[免責聲明]**
若涉及「法律」或「醫療」，請在開頭加上免責聲明。

<thought_process>
1. **輸入檢核**：...
2. **問題拆解**：...
3. **深度挖掘**：...
</thought_process>
...
                    `;

                    // Handle text vs file input mixing in user prompt
                    const userParts = [];
                    if (input.trim()) userParts.push({ text: `(使用者提問/連結內容)：${input}` });
                    
                    // Attachments
                    attachmentParts.forEach(part => {
                        if (part.text) {
                            userParts.push({ text: part.text });
                        } else if (part.inlineData) {
                            userParts.push({ inlineData: part.inlineData });
                        }
                    });

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: userParts }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            tools: [{ google_search: {} }],
                            generationConfig: {
                                temperature: 0.85, 
                                topK: 40,
                                topP: 0.95,
                                maxOutputTokens: 8192,
                            }
                        })
                    });

                    // 1. HTTP Error Check
                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    // 2. Logic Error Check (The "Undefined" Killer)
                    if (data.error) {
                         throw new Error(data.error.message || "API 回傳了錯誤物件");
                    }

                    // 3. Empty Response Check
                    if (!data.candidates || data.candidates.length === 0) {
                         throw new Error("模型已讀取，但因為安全性設定或權限問題，沒有回傳任何內容。");
                    }

                    // 4. Content Existence Check
                    const candidate = data.candidates[0];
                    if (!candidate.content || !candidate.content.parts || candidate.content.parts.length === 0) {
                         const reason = candidate.finishReason || 'Unknown';
                         throw new Error(`內容被阻擋，原因: ${reason}`);
                    }

                    const rawText = candidate.content.parts[0].text;

                    // 5. Parsing & Rendering
                    let thought = "";
                    let content = rawText;
                    
                    const thoughtMatch = rawText.match(/<thought_process>([\s\S]*?)<\/thought_process>/i);
                    if (thoughtMatch) {
                        thought = thoughtMatch[1].trim();
                        content = rawText.replace(/<thought_process>[\s\S]*?<\/thought_process>/i, "").trim();
                    }

                    setResult({
                        thought: thought,
                        content: content,
                        timestamp: new Date().toLocaleString('zh-TW')
                    });
                    addToast("分析完成！", "success");

                } catch (e) {
                    // 6. Safe Error Display
                    console.error("Generate Error:", e);
                    setError(e.message);
                    addToast("處理失敗，請查看錯誤訊息", "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleChatSend = async () => {
                if (!chatInput.trim() || !apiKey) return;

                const userMsg = { role: 'user', text: chatInput };
                const updatedMessages = [...chatMessages, userMsg];
                setChatMessages(updatedMessages);
                setChatInput('');
                setChatLoading(true);

                try {
                    const contextPrompt = `
[SYSTEM: 角色定義]
你現在是 TONY 楊文澤老師。
正在與你對話的是：${inquirerRole}。
請維持 TONY 老師的專業與溫暖人設，針對使用者的追問進行回答。
不要扮演提問者，你是回答者。

**[上下文]**
原始問題：${input}
原始回答：${result.content}
                    `;

                    const historyParts = updatedMessages.map(msg => ({
                        role: msg.role === 'user' ? 'user' : 'model',
                        parts: [{ text: msg.text }]
                    }));

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [
                                { role: 'user', parts: [{ text: contextPrompt }] }, 
                                ...historyParts
                            ],
                            tools: [{ google_search: {} }],
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error?.message || `Chat API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    // Robust check for chat
                    if (data.error) throw new Error(data.error.message);
                    if (!data.candidates || data.candidates.length === 0 || !data.candidates[0].content) {
                        const reason = data.candidates?.[0]?.finishReason || 'Unknown';
                        throw new Error(`無回應 (原因: ${reason})`);
                    }

                    const aiText = data.candidates[0].content.parts[0].text;

                    setChatMessages([...updatedMessages, { role: 'model', text: aiText }]);

                } catch (e) {
                    setChatMessages([...updatedMessages, { role: 'model', text: `(Error: ${e.message} - 請檢查 API Key 權限)` }]);
                } finally {
                    setChatLoading(false);
                }
            };

            const copyToClipboard = () => {
                if (result?.content) {
                    navigator.clipboard.writeText(result.content);
                    addToast("內容已複製", "success");
                }
            };
            
            const handleExportWord = () => {
                if (!result?.content) return;
                const html = marked.parse(result.content);
                exportToWord(html, `Tony_Viewpoint_${new Date().toISOString().slice(0,10)}.doc`);
                addToast("檔案下載中...", "info");
            };

            const getFileIcon = (type) => {
                if (type.startsWith('image/')) return 'image';
                if (type.includes('word')) return 'file'; 
                return 'file';
            };

            // Calculate API Key Status
            const isApiKeyReady = apiKey.length > 20;

            return (
                <div className="flex flex-col md:flex-row h-full">
                    {/* Full Screen Loading Overlay */}
                    {loading && (
                        <div className="full-loader">
                            <div className="w-24 h-24 mb-6 rounded-full border-4 border-amber-350 overflow-hidden shadow-[0_0_30px_rgba(251,191,36,0.6)] animate-pulse">
                                <img src="https://i.postimg.cc/Gh8Zt7SX/S_56844323.jpg" alt="Logo" className="w-full h-full object-cover" />
                            </div>
                            <div className="flex items-center gap-3">
                                <Icon name="loader" size={32} className="text-amber-500 animate-spin" />
                                <span className="text-xl font-bold text-slate-800 tracking-wide">TONY 老師正在思考中...</span>
                            </div>
                            <p className="text-slate-500 mt-2 text-sm font-mono animate-pulse">Analyzing Data & Generating Insights</p>
                        </div>
                    )}

                    {/* --- Sidebar --- */}
                    <div className="w-full md:w-80 bg-slate-800 text-slate-100 flex flex-col shadow-xl z-20 flex-shrink-0 transition-all border-r border-slate-700">
                        {/* Profile Header */}
                        <div className="p-6 border-b border-slate-700 flex flex-col items-center text-center">
                            <div className="w-24 h-24 rounded-full overflow-hidden border-4 border-amber-350 shadow-lg mb-4">
                                <img src="https://i.postimg.cc/Gh8Zt7SX/S_56844323.jpg" alt="Tony Avatar" className="w-full h-full object-cover" />
                            </div>
                            <h2 className="text-xl font-bold text-white mb-1">{TONY_PROFILE.name}</h2>
                            <p className="text-xs text-slate-400 font-medium tracking-wider uppercase">Digital Twin V2.9.17</p>
                        </div>
                        
                        {/* History Toggle */}
                        <div className="flex border-b border-slate-700 shrink-0">
                            <button onClick={() => setShowHistory(false)} className={`flex-1 py-3 text-xs font-bold uppercase tracking-wider ${!showHistory ? 'bg-slate-700 text-amber-350' : 'text-slate-400 hover:text-white'}`}>關於我</button>
                            <button onClick={() => setShowHistory(true)} className={`flex-1 py-3 text-xs font-bold uppercase tracking-wider ${showHistory ? 'bg-slate-700 text-amber-350' : 'text-slate-400 hover:text-white'}`}>歷史紀錄 ({history.length})</button>
                        </div>

                        {/* Content */}
                        <div className="flex-1 overflow-y-auto p-4 scrollbar-thin">
                            {!showHistory ? (
                                <div>
                                    <h3 className="text-amber-350 text-xs font-bold uppercase tracking-widest mb-3">Professional Bio</h3>
                                    <p className="text-sm text-slate-300 leading-relaxed mb-6 text-justify">{TONY_PROFILE.bio}</p>
                                    <h3 className="text-amber-350 text-xs font-bold uppercase tracking-widest mb-3">Roles</h3>
                                    <ul className="space-y-2">
                                        {TONY_PROFILE.titles.map((title, i) => (
                                            <li key={i} className="text-xs text-slate-300 flex items-start"><span className="mr-2 text-amber-350">•</span>{title}</li>
                                        ))}
                                    </ul>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    <div className="flex items-center justify-between bg-slate-900/50 p-2 rounded text-xs border border-slate-700 mb-4">
                                        <div className="flex items-center gap-1.5 text-slate-300">
                                            {isSyncing ? (
                                                <><Icon name="loader" size={14} className="text-blue-400"/> <span className="text-blue-400">同步中...</span></>
                                            ) : firebaseUser ? (
                                                <><Icon name="cloud" size={14} className="text-green-400"/> <span className="text-green-400">雲端已連線</span></>
                                            ) : (
                                                <><Icon name="save" size={14} className="text-amber-400"/> <span className="text-amber-400">本地儲存</span></>
                                            )}
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <input type="file" id="import-json" className="hidden" accept=".json" onChange={handleImportHistory} />
                                            <button onClick={() => document.getElementById('import-json').click()} className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors" title="匯入 JSON 歷史"><Icon name="upload" size={14} /></button>
                                            <button onClick={handleExportHistory} className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition-colors" title="備份匯出 JSON"><Icon name="download" size={14} /></button>
                                        </div>
                                    </div>

                                    {history.length === 0 && !isSyncing && <p className="text-slate-500 text-center text-xs mt-10">尚無儲存紀錄</p>}
                                    {history.map(item => (
                                        <div key={item.id} onClick={() => loadHistory(item)} className="bg-slate-700 p-3 rounded-lg cursor-pointer hover:bg-slate-600 transition-colors group relative border border-transparent hover:border-amber-350/50">
                                            <div className="flex justify-between items-start mb-1">
                                                <span className="text-[10px] text-amber-350 font-bold uppercase truncate max-w-[70%]">{item.role}</span>
                                                <span className="text-[10px] text-slate-400">{item.timestamp.split(' ')[0]}</span>
                                            </div>
                                            <p className="text-sm text-white font-medium line-clamp-2 mb-1">{item.question}</p>
                                            <p className="text-xs text-slate-400 truncate">{item.scenario}</p>
                                            <button onClick={(e) => deleteHistory(item.id, e)} className="absolute top-2 right-2 p-1 text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity" title="刪除"><Icon name="trash" size={14} /></button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Config Area */}
                        <div className="p-4 bg-slate-900 border-t border-slate-700 shrink-0">
                            <div className="flex items-center gap-2 mb-3 text-slate-400 text-xs font-bold uppercase">
                                <Icon name="settings" size={14} /> <span>System Configuration</span>
                            </div>
                            <div className="space-y-3">
                                <div>
                                    <div className="relative">
                                        <div className="absolute left-2 top-2 text-slate-500"><Icon name="key" size={14} /></div>
                                        <input type="password" value={apiKey} onChange={(e) => setApiKey(e.target.value)} onBlur={handleApiKeyBlur} placeholder="Gemini API Key" className={`w-full pl-8 pr-8 py-2 bg-slate-800 border rounded text-xs text-white placeholder-slate-500 outline-none transition-colors ${isApiKeyReady ? 'border-green-500 focus:border-green-400' : 'border-slate-700 focus:border-amber-350'}`} />
                                        {isApiKeyReady && <div className="absolute right-2 top-2 text-green-500"><Icon name="check" size={14} /></div>}
                                    </div>
                                    {isApiKeyReady && <p className="text-[10px] text-green-500 mt-1 flex items-center gap-1"><Icon name="check" size={10}/> API Key 已就緒</p>}
                                </div>
                                <div>
                                    <input type="text" value={modelName} onChange={(e) => setModelName(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded text-xs text-slate-300 focus:border-amber-350 outline-none transition-colors" placeholder="Model Name" />
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* --- Main Content --- */}
                    <div className="flex-1 flex flex-col bg-slate-50 relative overflow-hidden">
                        
                        <header className="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 shadow-sm flex-shrink-0">
                            <div className="flex items-center gap-3">
                                <img src={TONY_PROFILE.logoUrl} alt="Tony Studio" className="h-8 w-auto" />
                                <h1 className="text-lg font-bold text-slate-800 hidden sm:block">TONY老師您的觀點是什麼?</h1>
                            </div>
                            <div className="flex items-center gap-3">
                                {systemReady && (
                                    <div className="flex items-center gap-1 text-green-600 text-xs font-bold bg-green-50 px-2 py-1 rounded-full toast-top">
                                        <Icon name="check" size={12} /> Ready
                                    </div>
                                )}
                                <button 
                                    onClick={handleReset}
                                    className="p-2 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center gap-2 transition-colors border border-blue-200"
                                    title="清空話題，開始新的提問"
                                >
                                    <Icon name="refresh" size={18} />
                                    <span className="text-sm font-bold hidden sm:inline">重新提問</span>
                                </button>
                            </div>
                        </header>

                        <main className="flex-1 overflow-hidden flex flex-col md:flex-row relative">
                            
                            {/* Input Area */}
                            <div className={`flex flex-col border-r border-slate-200 bg-white transition-all duration-300 ${result ? 'md:w-1/3 hidden lg:flex' : 'md:w-1/2 mx-auto'} ${result && 'hidden md:flex'}`}>
                                <div className="p-4 border-b border-slate-100 bg-white space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1 text-amber-600">我是誰 (提問者身份)</label>
                                        <select value={inquirerRole} onChange={(e) => setInquirerRole(e.target.value)} className="w-full p-2 bg-amber-50 border border-amber-200 rounded-md text-sm outline-none font-medium text-slate-700">
                                            {INQUIRER_ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">應用情境</label>
                                            <select value={scenario} onChange={(e) => setScenario(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-md text-sm outline-none text-slate-600">
                                                {SCENARIOS.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">其他設定</label>
                                            <select disabled className="w-full p-2 bg-slate-100 border border-slate-200 rounded-md text-sm outline-none text-slate-400 cursor-not-allowed">
                                                <option>自動決定 (Auto)</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                {attachments.length > 0 && (
                                    <div className="px-6 pt-4 flex flex-wrap gap-2">
                                        {attachments.map((file, idx) => (
                                            <div key={idx} className="flex items-center gap-2 bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs border border-slate-200 max-w-full">
                                                <Icon name={getFileIcon(file.type)} size={14} />
                                                <span className="truncate max-w-[150px]">{file.name}</span>
                                                <button onClick={() => removeAttachment(idx)} className="hover:text-red-500"><Icon name="x" size={14} /></button>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="flex-1 p-6 flex flex-col min-h-0 relative">
                                    {isSearchActive && (
                                        <div className="absolute top-2 left-6 right-6 z-10 p-2 bg-green-50 border border-green-200 text-green-700 text-xs rounded-lg shadow-sm flex items-center gap-2">
                                            <Icon name="globe" size={14} />
                                            <span>🌍 Google 搜尋功能已待命</span>
                                        </div>
                                    )}
                                    <textarea 
                                        ref={textareaRef}
                                        className="flex-1 w-full p-4 bg-slate-50 border border-slate-200 rounded-lg resize-none focus:bg-white focus:ring-2 focus:ring-amber-350/50 outline-none transition-all text-base leading-relaxed custom-scrollbar" 
                                        placeholder="請輸入文字/連結，或上傳附件..." 
                                        value={input} 
                                        onChange={(e) => setInput(e.target.value)}
                                        style={{ minHeight: '120px' }}
                                    ></textarea>
                                    <div className="absolute bottom-2 right-4 text-xs text-slate-400 pointer-events-none">
                                        {input.length} 字
                                    </div>
                                    
                                    <div className="mt-4 flex items-center justify-between relative">
                                        <div className="flex items-center gap-2">
                                            <input type="file" ref={fileInputRef} onChange={handleFileSelect} className="hidden" multiple accept="image/*,application/pdf,text/plain,audio/*,video/*,.doc,.docx" />
                                            <button onClick={() => fileInputRef.current.click()} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors flex items-center gap-2" title="上傳檔案">
                                                <Icon name="paperclip" size={20} />
                                            </button>
                                            <button onClick={handleReset} className="p-2 text-red-500 hover:bg-red-50 rounded-full transition-colors flex items-center gap-2" title="清除內容 (Clear)">
                                                <Icon name="trash" size={20} />
                                            </button>
                                        </div>
                                        <button onClick={handleGenerate} className={`px-6 py-2 rounded-lg flex items-center gap-2 font-bold text-white shadow-md transition-all ${loading ? 'bg-slate-400 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-700 hover:shadow-lg active:scale-95'}`}>
                                            {loading ? <Icon name="loader" /> : (isSearchActive ? <Icon name="search" /> : <Icon name="bot" />)}
                                            {loading ? '分析中...' : '生成 TONY 觀點'}
                                        </button>
                                    </div>
                                    {error && <div className="mt-3 p-3 bg-red-50 text-red-600 text-sm rounded-md border border-red-200 flex items-center gap-2"><span className="font-bold">Error:</span> {error}</div>}
                                </div>
                            </div>

                            {/* Output Area */}
                            <div className={`flex-1 bg-slate-50 flex flex-col border-l border-slate-200 overflow-hidden ${!result ? 'hidden md:flex' : 'flex'}`}>
                                {result ? (
                                    <>
                                        <div className="h-12 border-b border-slate-200 bg-white flex items-center justify-between px-6 flex-shrink-0">
                                            <span className="text-xs font-mono text-slate-400">Generated: {result.timestamp}</span>
                                            <div className="flex gap-2">
                                                <button onClick={() => addToHistory(result)} className="text-slate-500 hover:text-amber-600 flex items-center gap-1 text-sm font-medium transition-colors"><Icon name="save" size={16} /> 儲存</button>
                                                <button onClick={handleExportWord} className="text-slate-500 hover:text-blue-600 flex items-center gap-1 text-sm font-medium transition-colors"><Icon name="download" size={16} /> 匯出 Word</button>
                                                <button onClick={copyToClipboard} className="text-slate-500 hover:text-green-600 flex items-center gap-1 text-sm font-medium transition-colors"><Icon name="copy" size={16} /> 複製</button>
                                            </div>
                                        </div>
                                        <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col">
                                            <div className="p-8 pb-4">
                                                {result.thought && (
                                                    <div className="thinking-block rounded-md">
                                                        <div className="thinking-header"><Icon name="eye" size={16} /> <span>TONY 老師的自省與評估...</span></div>
                                                        <div className="whitespace-pre-wrap leading-relaxed text-slate-600">{result.thought}</div>
                                                    </div>
                                                )}
                                                <div id="output-content" className="max-w-3xl mx-auto prose prose-slate">
                                                     <div dangerouslySetInnerHTML={{ __html: marked.parse(result.content) }} />
                                                </div>
                                                <div className="mt-8 pt-4 border-t border-slate-200 text-center text-xs text-slate-400 italic">此內容由 TONY 老師的數位孿生 V2.9.17 生成。</div>
                                            </div>
                                            <div className="mt-auto bg-blue-50 border-t border-blue-100 p-4">
                                                <div className="max-w-3xl mx-auto">
                                                    <div className="flex items-center gap-2 mb-4 text-blue-800 font-bold text-sm uppercase tracking-wider"><Icon name="message" size={18} /> TONY 諮詢室</div>
                                                    <div className="mb-4 space-y-3">
                                                        {chatMessages.map((msg, idx) => (
                                                            <div key={idx} className={`flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}`}>
                                                                <span className="text-[10px] text-slate-400 mb-1 px-1">
                                                                    {msg.role === 'user' ? `提問者 (${inquirerRole.split(' ')[0]})` : 'TONY 老師'}
                                                                </span>
                                                                <div className={`chat-bubble ${msg.role === 'user' ? 'chat-user' : (inquirerRole.includes('Myself') ? 'chat-self' : 'chat-bot shadow-sm')}`} dangerouslySetInnerHTML={{ __html: marked.parse(msg.text) }} />
                                                            </div>
                                                        ))}
                                                        {chatLoading && <div className="flex items-center gap-2 text-slate-400 text-xs ml-2"><Icon name="loader" size={14} /> TONY 老師正在輸入...</div>}
                                                        <div ref={chatEndRef} />
                                                    </div>
                                                    <div className="relative">
                                                        <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleChatSend()} placeholder="還有什麼想追問的嗎？" className="w-full pl-4 pr-12 py-3 bg-white border border-blue-200 rounded-full text-sm focus:ring-2 focus:ring-blue-300 outline-none shadow-sm" disabled={chatLoading} />
                                                        <button onClick={handleChatSend} disabled={chatLoading} className="absolute right-2 top-2 p-1.5 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors disabled:bg-slate-300"><Icon name="send" size={16} /></button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <div className="flex-1 flex flex-col items-center justify-center text-slate-300 p-8">
                                        <div className="w-20 h-20 bg-slate-200 rounded-full flex items-center justify-center mb-4 text-slate-400">
                                            <Icon name="bot" size={40} />
                                        </div>
                                        <h3 className="text-lg font-medium text-slate-400">TONY 老師準備中...</h3>
                                        <p className="text-sm mt-2 text-center max-w-xs">輸入問題，或上傳檔案（Word, PDF, 圖片, 影片），即可生成觀點。</p>
                                    </div>
                                )}
                            </div>
                        </main>
                        <footer className="h-8 bg-slate-900 text-slate-500 text-[10px] flex items-center justify-center flex-shrink-0 z-20">© 2026 TONY STUDIO. 本教材由 TONY STUDIO 楊文澤顧問設計. All Rights Reserved.</footer>
                    </div>
                    {/* Toast Container */}
                    <div className="fixed top-0 right-0 p-4 z-50 flex flex-col gap-2 pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className="pointer-events-auto">
                                <Toast message={t.message} type={t.type} onClose={() => removeToast(t.id)} />
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
